[package]
name = "fractality"
version = "0.1.0"
edition = "2021"

[dependencies]
# Default features off: skips bevy_audio (audio.rs uses an external capture
# process), gltf/scene/animation, and asset loaders this app never touches.
# For a wasm build add "webgpu" (the compute shaders rule out webgl2).
bevy = { version = "0.16", default-features = false, features = [
    "bevy_winit",
    "bevy_ui",
    "bevy_text",
    "default_font",
    "bevy_core_pipeline",
    "bevy_log",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "wayland",
    "x11",
] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
fastrand = "2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
strip = true
