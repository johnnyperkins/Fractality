[package]
name = "fractality"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.16", features = ["wayland"] }
bytemuck = { version = "1", features = ["derive"] }
rayon = "1"
fastrand = "2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
