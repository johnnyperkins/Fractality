[package]
name = "fractality"
version = "0.1.0"
edition = "2021"

[dependencies]
# Default features off: skips bevy_audio (audio.rs uses an external capture
# process), gltf/scene/animation, and asset loaders this app never touches.
bevy = { version = "0.16", default-features = false, features = [
    "bevy_winit",
    "bevy_ui",
    "bevy_text",
    "default_font",
    "bevy_core_pipeline",
    "bevy_log",
    "png",
    "tonemapping_luts",
] }
bytemuck = { version = "1", features = ["derive"] }
fastrand = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.16", default-features = false, features = [
    "multi_threaded",
    "wayland",
    "x11",
] }
mp4 = "0.14.0"
openh264 = "0.9.7"
rayon = "1"

# Web build needs "webgpu": the compute shaders rule out webgl2.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.16", default-features = false, features = ["webgpu"] }
console_error_panic_hook = "0.1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioBuffer",
    "Blob",
    "BlobEvent",
    "BlobPropertyBag",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "HtmlElement",
    "Url",
    "AudioContext",
    "AudioContextOptions",
    "AudioDestinationNode",
    "AudioNode",
    "AudioProcessingEvent",
    "DisplayMediaStreamConstraints",
    "MediaDevices",
    "MediaRecorder",
    "MediaStream",
    "MediaStreamAudioSourceNode",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "ScriptProcessorNode",
    "Window",
] }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
[profile.release]
lto = "thin"
strip = true
